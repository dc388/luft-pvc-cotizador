<title>LUFT PVC · Cotizador</title>
<meta name="description" content="Cotizador técnico de cancelería de PVC con catálogo real Aluplast (EXWORK Veracruz, rev. ABR_22) y editor compositivo de ventanas estilo RA Workshop.">
<style>
:root{
  --paper:#eef1f2; --surface:#ffffff; --ink:#171b1e;
  --line:#d7dee1; --muted:#5c6b72; --warn-bg:#fff5dc; --warn-fg:#795b1a; --warn-line:#f1d792;
  --ok-bg:#e8f2e7; --ok-fg:#367558; --shadow:#14231c1f; --accent:#1D6CA6;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#12161a; --surface:#1b2126; --ink:#e6ecef;
    --line:#2b3339; --muted:#8fa0a8; --warn-bg:#3a2f10; --warn-fg:#f0cf7a; --warn-line:#5b4a1c;
    --ok-bg:#183828; --ok-fg:#7fd8ab; --shadow:#00000055;
  }
}
:root[data-theme="dark"]{
  --paper:#12161a; --surface:#1b2126; --ink:#e6ecef;
  --line:#2b3339; --muted:#8fa0a8; --warn-bg:#3a2f10; --warn-fg:#f0cf7a; --warn-line:#5b4a1c;
  --ok-bg:#183828; --ok-fg:#7fd8ab; --shadow:#00000055;
}
:root[data-theme="light"]{
  --paper:#eef1f2; --surface:#ffffff; --ink:#171b1e;
  --line:#d7dee1; --muted:#5c6b72; --warn-bg:#fff5dc; --warn-fg:#795b1a; --warn-line:#f1d792;
  --ok-bg:#e8f2e7; --ok-fg:#367558; --shadow:#14231c1f;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=number],input[type=text]{width:100%;height:40px;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:0 10px;color:var(--ink);font-size:12px}
textarea{background:var(--paper);color:var(--ink)}
a{color:inherit}

.topbar{height:76px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20;gap:12px}
.brand{color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:12px;letter-spacing:.08em;font-size:18px}
.brand b{color:var(--accent);transition:color .2s}
.brandMark{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;transition:background .2s}
.projectName{display:flex;flex-direction:column;text-align:center;gap:2px}
.projectName span,.eyebrow,.quoteHead span,.metricRow span,.totalBox span,.priceNote{font-size:10px;letter-spacing:.12em;color:var(--muted)}
.projectName strong{font-size:13px}
.headerActions{display:flex;gap:8px;align-items:center}
.primary{padding:11px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:12px;font-weight:bold;transition:background .2s,border-color .2s}
.selfCheckBadge{font-size:9px;padding:7px 11px;border-radius:20px;font-weight:bold;cursor:default;white-space:nowrap}
.selfCheckBadge.ok{background:var(--ok-bg);color:var(--ok-fg)}
.selfCheckBadge.warn{background:var(--warn-bg);color:var(--warn-fg)}

.moduleNav{height:42px;display:flex;justify-content:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:76px;z-index:19}
.moduleNav button{border:0;background:transparent;padding:0 24px;font-size:11px;color:var(--muted);border-bottom:2px solid transparent}
.moduleNav button.active{color:var(--accent);font-weight:bold;border-bottom-color:var(--accent)}

.workspace{display:grid;grid-template-columns:360px minmax(460px,1fr) 390px;min-height:calc(100vh - 76px)}
.configPanel,.quotePanel{background:var(--surface);padding:28px;border-right:1px solid var(--line);overflow:auto}
.quotePanel{border-right:0;border-left:1px solid var(--line);padding:0 26px 24px}
.eyebrow{color:var(--accent);font-weight:bold;margin-bottom:10px}
.configPanel h1{font-family:Georgia,serif;font-size:40px;line-height:1.02;margin:0 0 12px;letter-spacing:-.04em;text-wrap:balance}
.lead{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:24px}
.step{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:20px}
.step>span{color:var(--accent);font-size:11px;font-weight:bold}
.step div{display:flex;flex-direction:column;gap:3px}
.step b{font-size:13px}
.step small{color:var(--muted);font-size:11px}
.segmented{display:grid;grid-template-columns:1fr 1fr;margin:14px 0 12px;border:1px solid var(--line);border-radius:9px;padding:3px}
.segmented button{border:0;background:transparent;padding:10px;font-size:10px;font-weight:800;color:var(--muted);border-radius:6px}
.segmented button.selected{background:var(--accent);color:#fff}
.configPanel label,.additional label{display:flex;flex-direction:column;gap:6px;font-size:10px;color:var(--muted);font-weight:bold;margin-top:10px}
.inputGrid{display:grid;grid-template-columns:1fr 1fr 80px;gap:8px}
.inputGrid.two{grid-template-columns:1fr 1fr}
.summaryCard{margin-top:16px;display:grid;grid-template-columns:1fr 1.4fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.summaryCard span,.summaryCard b{padding:9px;font-size:10px;border-bottom:1px solid var(--line)}
.summaryCard span{background:var(--paper);color:var(--muted)}
.sourceNote{font-size:9px;color:var(--muted);line-height:1.4;margin:6px 0 0}
.sourceNote b{color:var(--ok-fg)}

.visualPanel{display:flex;flex-direction:column;min-width:0}
.visualHeader{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:9px;letter-spacing:.09em;color:var(--muted);border-bottom:1px solid var(--line)}
.statusDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4bb17c;margin-right:8px}
.viewSwitch{display:flex;background:var(--paper);border-radius:7px;padding:2px}
.viewSwitch button{border:0;background:transparent;font-size:10px;padding:7px 12px;border-radius:5px;color:var(--ink)}
.viewSwitch .active{background:var(--surface)}
.canvas{position:relative;flex:1;min-height:500px;display:grid;place-items:center;padding:70px;background-color:var(--paper);background-image:linear-gradient(color-mix(in srgb, var(--ink) 6%, transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb, var(--ink) 6%, transparent) 1px,transparent 1px);background-size:28px 28px}
.modelStage{width:min(76%,650px);perspective:1100px;position:relative;display:grid;place-items:center}
.modelStage .window{width:100%;max-height:420px}
.view-3D .modelStage{transform-style:preserve-3d;transform:rotateY(-24deg) rotateX(3deg);filter:drop-shadow(28px 28px 24px var(--shadow))}
.view-3D .window{transform-style:preserve-3d;box-shadow:none}
.modelSide{position:absolute;top:0;right:-22px;width:24px;height:100%;background:linear-gradient(90deg,#0c1713,#35473f);transform-origin:left;transform:rotateY(90deg);border:1px solid #08100d}
.modelSill{position:absolute;left:0;right:0;bottom:-20px;height:22px;background:linear-gradient(#23332c,#0d1814);transform-origin:top;transform:rotateX(-90deg)}
.window{width:min(76%,650px);max-height:420px;border:15px solid #1d2924;background:linear-gradient(135deg,#b9d5d7,#e5eeee 45%,#afcdd0);display:flex;box-shadow:0 24px 40px var(--shadow);position:relative;min-height:190px}
.window.whiteFrame{border-color:#f7f7f2;box-shadow:0 0 0 1px #aeb8b1,0 24px 40px var(--shadow)}
.splitNode{display:flex;min-width:0;min-height:0;position:relative}
.splitNode.axisCol{flex-direction:row}
.splitNode.axisRow{flex-direction:column}
.pane{flex:1;position:relative;border:5px solid #24352e;background:linear-gradient(145deg,#9cbec4cc,#e9f2f0cc 55%,#91b8c2cc);overflow:hidden;min-width:0}
.whiteFrame .pane{border-color:#e8eae5}
.pane:after{content:"";position:absolute;width:160%;height:14px;background:#ffffff22;transform:rotate(-35deg);top:24%;left:-30%;pointer-events:none}
.pane.selectedPane{outline:4px solid var(--accent);outline-offset:-4px;box-shadow:inset 0 0 0 2px #14231c}
.hit{position:absolute;appearance:none;padding:0;border:0;background:transparent;cursor:pointer}
.hit:hover{box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent)}
.hitMarco{inset:0;z-index:1}
.hitHoja{inset:9%;z-index:2;display:grid;place-items:center}
.hitVidrio{inset:17%;z-index:3}
.hitHerraje{position:absolute;z-index:5;bottom:6px;left:6px;width:24px;height:24px;border-radius:50%;background:#ffffffd9;color:#274d3e;font-size:12px;display:grid;place-items:center}
.motion{position:absolute;z-index:3;inset:0;display:grid;place-items:center;color:#2870a2;font-size:18px;pointer-events:none}
.pane em{position:absolute;z-index:4;bottom:4px;right:34px;font-size:8px;font-style:normal;color:#325248;pointer-events:none}
.openingLines{position:absolute;inset:0;display:block;background:linear-gradient(32deg,transparent 49.7%,#ffffffaa 50%,transparent 50.4%),linear-gradient(-32deg,transparent 49.7%,#ffffffaa 50%,transparent 50.4%);pointer-events:none}
.paneHardware{position:absolute;z-index:4;top:5px;left:5px;background:#ffffffd9;color:#274d3e;padding:3px 5px;border-radius:4px;font-size:7px;pointer-events:none}
.paneDim{position:absolute;z-index:4;bottom:5px;right:5px;background:#ffffffd9;color:#274d3e;padding:3px 5px;border-radius:4px;font-size:7px;font-weight:normal;font-style:normal;pointer-events:none}
.dim{position:absolute;color:var(--muted);font-size:10px;letter-spacing:.07em}
.dim.top{top:40px;left:19%;right:19%;border-top:1px solid var(--line);text-align:center}
.dim.top span{background:var(--paper);padding:0 8px;position:relative;top:-7px}
.dim.side{left:42px;top:20%;bottom:20%;border-left:1px solid var(--line);display:flex;align-items:center}
.dim.side span{background:var(--paper);padding:6px;transform:rotate(-90deg);margin-left:-24px}
.editHint{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--accent);border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));padding:7px 11px;border-radius:20px;font-size:8px;letter-spacing:.06em;text-align:center;max-width:70%;z-index:7;box-shadow:0 4px 14px var(--shadow)}
.specChip{position:absolute;left:24px;bottom:22px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 13px;display:flex;flex-direction:column;font-size:10px;gap:3px;box-shadow:0 6px 18px var(--shadow)}
.specChip span{color:var(--muted)}
.metricRow{height:74px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.metricRow div{padding:16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.metricRow strong{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

.toolbox{position:absolute;top:70px;left:16px;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 24px var(--shadow);max-height:calc(100% - 100px);overflow:auto}
.toolboxGroup{display:flex;flex-direction:column;gap:6px}
.toolboxGroup>span{font-size:8px;letter-spacing:.08em;color:var(--muted);font-weight:bold}
.toolboxGrid{display:grid;grid-template-columns:repeat(4,28px);gap:5px}
.toolboxGrid button{width:28px;height:28px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:14px;color:var(--accent);display:grid;place-items:center;padding:0}
.toolboxGrid button.active{border-color:var(--accent);background:var(--accent);color:#fff}
.toolboxAction{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 8px;font-size:9px;text-align:left;color:var(--ink)}
.toolboxAction:disabled{opacity:.4;cursor:not-allowed}

.sectionRender{width:70%;display:grid;grid-template-columns:220px 1fr;gap:25px;align-items:center}
.profileSection{height:180px;border:18px solid #1d2924;background:#d9e0db;position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:18px}
.chamber{border:5px solid #52645c;background:#f3f5f1}
.glassSection{position:absolute;top:-45px;bottom:-45px;left:50%;background:#a8d4de99;border:2px solid #518b96;transform:translateX(-50%)}
.sectionInfo{display:flex;flex-direction:column;gap:9px}
.sectionInfo b{font-size:14px}
.sectionInfo span{font-size:10px;color:var(--muted)}

.quoteHead{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.quoteHead>div{display:flex;flex-direction:column;gap:4px}
.quoteHead strong{font-size:20px}
.badge{background:var(--ok-bg);color:var(--ok-fg)!important;padding:7px 9px;border-radius:20px;letter-spacing:0!important;font-size:10px}
.badge.warning{background:var(--warn-bg)!important;color:var(--warn-fg)!important}
.warnings{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;margin:10px 0;padding:8px}
.warnings p{margin:3px;font-size:9px;color:var(--warn-fg)}

.componentEditor{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 14px}
.componentTitle{background:var(--accent);color:#fff;padding:12px;display:grid;grid-template-columns:1fr auto;gap:3px;transition:background .2s}
.componentTitle span{grid-column:1/3;font-size:7px;letter-spacing:.14em;color:#ffffffbb}
.componentTitle b{font-size:15px}
.componentTitle small{font-size:8px;align-self:center}
.componentGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px}
.componentGrid label{font-size:8px;color:var(--muted);border-radius:6px;padding:3px;transition:background .25s,box-shadow .25s}
.componentGrid select{height:32px;font-size:9px}
.componentGrid .wide{grid-column:1/3}
.componentGrid textarea{width:100%;min-height:55px;border:1px solid var(--line);border-radius:6px;padding:7px;font:9px Arial}
.componentGrid .checkRow{grid-column:1/3;flex-direction:row!important;align-items:center;gap:7px;padding:7px 3px}
.componentGrid .checkRow input{width:auto;height:auto}
.partFocus{outline:2px solid var(--accent);outline-offset:1px;background:color-mix(in srgb, var(--accent) 10%, transparent)}
.componentNote{font-size:8px;line-height:1.45;color:var(--warn-fg);background:var(--warn-bg);margin:0;padding:9px}
.fullButton{width:100%;border:1.5px solid var(--accent);background:transparent;padding:12.5px 14px;border-radius:8px;color:var(--accent);font-size:11px;font-weight:bold;display:flex;justify-content:space-between;margin-top:10px;transition:background .15s,color .15s}
.fullButton:hover{background:var(--accent);color:#fff}

.propertyGroup{margin-bottom:14px}
.propertyGroup h2,.costSummary h2{font-size:11px;background:color-mix(in srgb, var(--accent) 12%, var(--surface));padding:7px 8px;margin:0;color:var(--accent)}
.prop{display:grid;grid-template-columns:1.15fr 1fr;border-bottom:1px solid var(--line);font-size:9px}
.prop span,.prop b{padding:6px 8px}
.prop span{color:var(--muted);background:var(--paper)}
.prop b{text-align:right;font-weight:500}
.line{display:flex;justify-content:space-between;padding:7px 0;color:var(--muted);font-size:11px}
.line b{color:var(--ink)}
.direct{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0;font-size:10px}
.totalBox{background:var(--accent);color:#fff;border-radius:10px;padding:16px;margin:12px 0;transition:background .2s}
.totalBox>span{color:#ffffffcc;display:flex;justify-content:space-between}
.totalBox small{font-size:8px}
.totalBox>strong{display:block;font-family:Georgia,serif;font-size:28px;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.totalBox div{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid #ffffff33;font-size:11px}
.totalBox div span{color:#ffffffcc}
.materials{border-top:1px solid var(--line);margin-top:12px}
.materials summary{padding:10px 0;font-size:10px;font-weight:bold;cursor:pointer}
.materialItem{display:grid;grid-template-columns:68px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.materialItem>span{font-size:9px;color:var(--accent)}
.materialItem div{display:flex;justify-content:space-between;gap:8px}
.materialItem b,.materialItem small{font-size:10px}
.materialItem small{color:var(--muted);white-space:nowrap}
.priceNote{text-align:center;line-height:1.5;margin-top:12px;letter-spacing:.04em}

.optimization{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;border:1px solid var(--line);border-radius:9px;padding:15px;margin:14px 0}
.optimization strong{font-size:30px;grid-row:1/3;color:var(--accent);font-variant-numeric:tabular-nums}
.optimization span{font-size:9px;color:var(--muted)}
.optimization b{font-size:13px}
.cutPlan{margin:14px 0;max-height:230px;overflow:auto}
.cutPlan>div{margin-bottom:9px}
.cutPlan header{display:flex;justify-content:space-between;font-size:8px;margin-bottom:3px}
.cutPlan header span{color:var(--muted)}
.cutPlan section{height:25px;display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.cutPlan i,.cutPlan em{display:grid;place-items:center;min-width:32px;padding:0 3px;border-right:1px solid var(--surface);background:#5e9e84;color:#fff;font-size:7px;font-style:normal}
.cutPlan em{background:var(--paper);color:var(--muted);border:0}
.notice{font-size:10px;line-height:1.5;color:var(--warn-fg);background:var(--warn-bg);padding:10px;border-radius:7px}
.profileFilters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.profileCount{font-size:9px;color:var(--muted);margin:4px 0 10px}
.profileCatalog{display:grid;gap:6px;max-height:420px;overflow:auto}
.profileCatalog>div{display:grid;grid-template-columns:44px 1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.profileSketch{display:grid;place-items:center;background:var(--paper);font-size:20px;color:var(--accent)}
.profileCatalog section{padding:7px}
.profileCatalog b{font-size:9px;color:var(--accent)}
.profileCatalog p{font-size:9px;margin:3px 0}
.profileCatalog small{font-size:8px;color:var(--muted)}

.reportList{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.reportList button{display:flex;justify-content:space-between;border:1px solid var(--line);background:var(--surface);padding:11px;border-radius:7px;font-size:9px;color:var(--ink)}
.reportList button.selected{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, var(--surface));color:var(--accent);font-weight:bold}
.reportPreview{margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:5px;overflow:hidden}
.reportPreview>header{padding:15px;background:var(--paper);display:flex;flex-direction:column;gap:3px}
.reportPreview>header span{font-size:8px;letter-spacing:.12em;color:var(--accent)}
.reportPreview>header b{font-size:18px}
.reportPreview>header small{font-size:8px;color:var(--muted)}
.reportPreview h3{font-size:11px;margin:15px}
.reportPreview table{border-collapse:collapse;width:calc(100% - 20px);margin:0 10px 15px;font-size:7px}
.reportPreview th,.reportPreview td{border:1px solid var(--line);padding:5px;text-align:left}
.reportPreview tfoot th{background:var(--paper)}
.reportRow{display:grid;grid-template-columns:1.4fr 1fr .8fr;border-top:1px solid var(--line);padding:8px 10px;gap:6px;align-items:center}
.reportRow span,.reportRow b,.reportRow small{font-size:8px}
.reportRow b{text-align:right}
.reportRow small{text-align:right;color:var(--muted)}

.reportDoc{margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;overflow:hidden;font-size:10px;color:var(--ink)}
.docPage{padding:26px}
.docPageBreak{border-top:2px dashed var(--line);margin-top:6px}
.docHeader{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.docHeader .brandMark{width:34px;height:34px;font-size:15px}
.docBrandRow{display:flex;align-items:center;gap:10px}
.docBrandRow b{font-size:13px;letter-spacing:.04em}
.docTitle{font-family:Georgia,serif;font-size:24px;margin:10px 0 0;letter-spacing:-.02em}
.docMeta{text-align:right;font-size:9px;color:var(--muted);line-height:1.6}
.docMeta b{color:var(--ink);font-weight:bold}
.docIntro{font-size:9.5px;line-height:1.6;color:var(--muted);margin:0 0 16px;max-width:62ch}
.docItem{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.docItemHead{background:color-mix(in srgb, var(--accent) 10%, var(--surface));padding:8px 12px;font-size:10px;font-weight:bold;color:var(--accent)}
.docItemBody{display:grid;grid-template-columns:1.3fr 1fr;gap:0}
.docSpecTable{border-collapse:collapse;width:100%;font-size:9px}
.docSpecTable td{border-bottom:1px solid var(--line);padding:7px 10px}
.docSpecTable td:first-child{color:var(--muted);width:38%}
.docDiagramBox{display:flex;align-items:center;justify-content:center;padding:16px;background:var(--paper);border-left:1px solid var(--line)}
.docDiagramBox .window{width:100%;max-width:220px;max-height:140px;min-height:70px}
.docTable{border-collapse:collapse;width:100%;font-size:9px;margin-bottom:4px}
.docTable th,.docTable td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.docTable th{background:color-mix(in srgb, var(--accent) 8%, var(--paper));font-size:8.5px;letter-spacing:.02em;color:var(--ink)}
.docTable tfoot td{background:var(--paper);font-weight:bold}
.docTotalRow{display:flex;justify-content:space-between;padding:10px 4px;font-size:10px;border-top:1px solid var(--line)}
.docTotalRow.grand{font-weight:bold;font-size:12px}
.docStatGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.docStatGrid div{border:1px solid var(--line);border-radius:7px;padding:10px}
.docStatGrid span{display:block;font-size:8px;color:var(--muted);letter-spacing:.06em}
.docStatGrid b{font-size:14px}
.docTerms h4{font-size:10px;margin:16px 0 6px;color:var(--accent)}
.docTerms p,.docTerms li{font-size:9px;line-height:1.6;color:var(--ink);margin:4px 0}
.docBank{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:9px;line-height:1.7;margin:8px 0}
.docSignatures{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:34px}
.docSignatures div{border-top:1px solid var(--ink);padding-top:6px;font-size:9px;color:var(--muted)}
.checkboxCell{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:2px;display:inline-block}

.cutGroup{margin-bottom:18px}
.cutGroupHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.cutGroupHead b{font-size:11px;color:var(--accent)}
.cutGroupHead span{font-size:8.5px;color:var(--muted)}
.cutBarRow{margin-bottom:10px}
.cutBarLabel{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-bottom:3px}
.cutBar{display:flex;height:28px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.cutBarPiece{display:flex;align-items:center;justify-content:center;font-size:7.5px;color:#fff;border-right:1px solid var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cutBarWaste{display:flex;align-items:center;justify-content:center;font-size:7.5px;color:var(--muted);background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 5px,var(--line) 5px,var(--line) 10px)}
.cutPieceTable{width:100%;border-collapse:collapse;font-size:8px;margin-top:4px}
.cutPieceTable th,.cutPieceTable td{border:1px solid var(--line);padding:4px 6px;text-align:left}
@media print{.reportDoc{border:0;border-radius:0}.docPage{padding:0}.docPageBreak{border-top:0;page-break-before:always;margin-top:0;padding-top:26px}}

.sources{background:var(--surface);color:var(--muted);padding:18px 30px;font-size:9px;text-align:center;border-top:1px solid var(--line)}
.sources a{color:var(--accent)}

@media(max-width:1150px){
  .workspace{grid-template-columns:330px 1fr}
  .quotePanel{grid-column:1/3;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
  .quoteHead,.priceNote{grid-column:1/3}
  .totalBox,.fullButton{align-self:end}
}
@media(max-width:760px){
  .topbar{height:auto;padding:12px 15px;flex-wrap:wrap}
  .projectName{display:none}
  .workspace{display:block}
  .configPanel,.quotePanel{border:0;padding:22px}
  .visualPanel{min-height:600px}
  .canvas{min-height:430px;padding:50px}
  .metricRow{grid-template-columns:1fr 1fr;height:auto}
  .configPanel h1{font-size:34px}
  .inputGrid{grid-template-columns:1fr 1fr}
  .inputGrid label:last-child{grid-column:1/3}
  .window{width:88%;border-width:9px}
  .moduleNav{top:auto;overflow:auto;justify-content:flex-start}
  .moduleNav button{padding:0 16px}
  .toolbox{display:none}
  .sectionRender{width:95%;grid-template-columns:1fr}
  .view-3D .modelStage{transform:rotateY(-16deg) scale(.88)}
  .profileFilters{grid-template-columns:1fr}
}
@media print{
  .topbar,.configPanel,.viewSwitch,.moduleNav,.toolbox,.fullButton,.priceNote,.sources{display:none!important}
  .workspace{display:block}
  .visualPanel{min-height:600px}
  .quotePanel{border:0}
  .canvas{min-height:480px}
}

  "casement-in": "Abatible interior", "casement-out": "Abatible exterior", "tilt-turn": "Oscilobatiente", project: "Proyectante",

function defaultSpecFor(wing) {
  const fixed = wing === "fixed" || wing === "inactive";
  const directional = wing === "sliding" || wing === "lift-slide" || wing === "folding-sliding";
  return {
    state: wing === "inactive" ? "Inactiva" : fixed ? "Fija" : "Móvil",
    opening: OPENING_BY_WING[wing],
    direction: directional ? "Derecha" : "N/A",
    hardware: fixed ? "Sin herraje" : (HARDWARE_BY_WING[wing] || "Roto · cierre multipunto"),
    handle: fixed ? "Sin manilla" : (HANDLE_BY_WING[wing] || "Harmony con tetones"),
  };
}

function createLeaf(wing, spec) {
  return { kind: "leaf", id: crypto.randomUUID(), wing: wing || "fixed", spec: Object.assign({ glass: "Heredar vidrio general", notes: "", mallorquina: false }, defaultSpecFor(wing || "fixed"), spec || {}) };
}

function createDefaultTree() {
  return { kind: "split", id: crypto.randomUUID(), axis: "col", ratios: [0.5, 0.5], children: [createLeaf("sliding"), createLeaf("sliding", { direction: "Izquierda" })] };
}

const isLeaf = (n) => n.kind === "leaf";

function firstLeafId(tree) { return tree.kind === "leaf" ? tree.id : firstLeafId(tree.children[0]); }

function walkLeaves(tree) { return tree.kind === "leaf" ? [tree] : tree.children.flatMap(walkLeaves); }

function findNode(tree, id) {
  if (tree.id === id) return tree;
  if (tree.kind === "split") for (const c of tree.children) { const f = findNode(c, id); if (f) return f; }
  return null;
}

function findParentSplitId(tree, childId) {
  if (tree.kind !== "split") return null;
  if (tree.children.some((c) => c.id === childId)) return tree.id;
  for (const c of tree.children) { const f = findParentSplitId(c, childId); if (f) return f; }
  return null;
}

function mapLeaf(tree, id, fn) {
  if (tree.id === id) return tree.kind === "leaf" ? fn(tree) : tree;
  if (tree.kind === "split") return Object.assign({}, tree, { children: tree.children.map((c) => mapLeaf(c, id, fn)) });
  return tree;
}

function splitLeafFn(tree, id, axis, fraction) {
  const f = Math.min(0.85, Math.max(0.15, fraction));
  return mapLeaf(tree, id, (leaf) => ({
    kind: "split", id: leaf.id, axis, ratios: [f, 1 - f],
    children: [Object.assign({}, leaf, { id: crypto.randomUUID() }), Object.assign({}, leaf, { id: crypto.randomUUID() })],
  }));
}

function setWingFn(tree, id, wing) {
  return mapLeaf(tree, id, (leaf) => ({ kind: "leaf", id: leaf.id, wing, spec: Object.assign({}, leaf.spec, defaultSpecFor(wing)) }));
}

function updateSpecFn(tree, id, patch) {
  return mapLeaf(tree, id, (leaf) => ({ kind: "leaf", id: leaf.id, wing: leaf.wing, spec: Object.assign({}, leaf.spec, patch) }));
}

function removeSplitFn(tree, splitId) {
  function walk(node) {
    if (node.kind !== "split") return node;
    if (node.id === splitId) {
      const base = node.children.find(isLeaf) || createLeaf();
      return { kind: "leaf", id: node.id, wing: base.wing, spec: base.spec };
    }
    return Object.assign({}, node, { children: node.children.map(walk) });
  }
  return walk(tree);
}

function flattenToRects(tree, width, height, x, y) {
  x = x || 0; y = y || 0;
  if (tree.kind === "leaf") return [{ id: tree.id, wing: tree.wing, spec: tree.spec, x, y, w: width, h: height }];
  const rects = [];
  let offset = 0;
  tree.children.forEach((child, i) => {
    const ratio = tree.ratios[i];
    if (tree.axis === "col") {
      const w = width * ratio;
      rects.push.apply(rects, flattenToRects(child, w, height, x + offset, y));
      offset += w;
    } else {
      const h = height * ratio;
      rects.push.apply(rects, flattenToRects(child, width, h, x, y + offset));
      offset += h;
    }
  });
  return rects;
}

// ---------- CALC ----------
function splitterLengthM(node, widthMm, heightMm) {
  if (node.kind === "leaf") return 0;
  const dividerLenM = (node.axis === "col" ? heightMm : widthMm) / 1000;
  let total = (node.children.length - 1) * dividerLenM;
  node.children.forEach((child, i) => {
    const ratio = node.ratios[i];
    const w = node.axis === "col" ? widthMm * ratio : widthMm;
    const h = node.axis === "row" ? heightMm * ratio : heightMm;
    total += splitterLengthM(child, w, h);
  });
  return total;
}

function calcQuote(p) {
  const w = p.width / 1000, h = p.height / 1000;
  const area = w * h, perimeter = 2 * (w + h);
  const rects = flattenToRects(p.tree, p.width, p.height);
  const leaves = rects.map((r) => {
    const wM = r.w / 1000, hM = r.h / 1000;
    return { id: r.id, wing: r.wing, spec: r.spec, wMm: r.w, hMm: r.h, glassArea: Math.max(0, (wM - 0.12) * (hM - 0.12)), sashPerimeter: 2 * (wM + hM) };
  });
  const frameM = perimeter + splitterLengthM(p.tree, p.width, p.height);
  const sashM = leaves.reduce((a, l) => a + l.sashPerimeter, 0);
  const glassArea = leaves.reduce((a, l) => a + l.glassArea, 0);
  const profileCost = (frameM * p.sys.frame + sashM * p.sys.sash) * p.color.factor;
  const glassCost = glassArea * p.glass.price;
  const reinforce = (frameM + sashM) * 78;
  const seals = (frameM + sashM) * 24;
  const accessories = p.sys.hardware + leaves.length * 110 + p.rail * 165;
  const addons = leaves.reduce((a, l) => a + (l.spec.mallorquina ? (l.wMm / 1000) * MALLORQUINA_RATE_MXN_PER_M * 2 : 0), 0);
  const consumables = (profileCost + glassCost) * 0.045;
  const direct = profileCost + glassCost + reinforce + seals + accessories + addons + consumables + p.installation + p.transport;
  const sale = (direct / (1 - p.margin / 100)) * (1 - p.discount / 100);
  const bars = Math.ceil((frameM + sashM) / 6);
  const waste = Math.max(0, bars * 6 - frameM - sashM);
  return { w, h, area, perimeter, leaves, frameM, sashM, glassArea, profileCost, glassCost, reinforce, seals, accessories, addons, consumables, direct, sale, total: sale * p.qty, utility: (sale - direct) * p.qty, bars, waste };
}

// ---------- CUT-LIST OPTIMIZER (real 1D bin packing, first-fit-decreasing) ----------
const BAR_LENGTH_MM = 5800;
const KERF_MM = 5;

function packBars(pieces, barLength, kerf) {
  const sorted = [...pieces].sort((a, b) => b.length - a.length);
  const bars = [];
  for (const piece of sorted) {
    let placed = false;
    for (const bar of bars) {
      const used = bar.pieces.reduce((a, p) => a + p.length, 0) + bar.pieces.length * kerf;
      if (used + piece.length <= barLength) { bar.pieces.push(piece); placed = true; break; }
    }
    if (!placed) bars.push({ pieces: [piece] });
  }
  return bars.map((bar) => {
    const used = bar.pieces.reduce((a, p) => a + p.length, 0) + Math.max(0, bar.pieces.length - 1) * kerf;
    return { pieces: bar.pieces, used, waste: barLength - used };
  });
}

// Derives real cut pieces from the tree: 4 outer marco pieces regardless of splits, one
// travesaño per internal divider (its own actual cross-axis length), 4 hoja pieces per
// operable leaf (fixed/inactive leaves glaze straight into marco/travesaño, no sash), and 4
// junquillo (glazing bead) pieces per leaf.
function buildCutList(tree, width, height) {
  const marco = [
    { label: "Marco: Abajo", length: width, angle: "45°" },
    { label: "Marco: Arriba", length: width, angle: "45°" },
    { label: "Marco: Izquierda", length: height, angle: "45°" },
    { label: "Marco: Derecha", length: height, angle: "45°" },
  ];
  const travesanos = [];
  (function walk(node, w, h) {
    if (node.kind === "leaf") return;
    const crossLen = Math.round(node.axis === "col" ? h : w);
    for (let i = 0; i < node.children.length - 1; i++) travesanos.push({ label: "Travesaño", length: crossLen, angle: "90°" });
    node.children.forEach((child, i) => {
      const cw = node.axis === "col" ? w * node.ratios[i] : w;
      const ch = node.axis === "row" ? h * node.ratios[i] : h;
      walk(child, cw, ch);
    });
  })(tree, width, height);
  const hojas = [];
  const junquillos = [];
  flattenToRects(tree, width, height).forEach((r, i) => {
    const label = `Hoja ${String.fromCharCode(65 + i)}`;
    const w = Math.round(r.w), h = Math.round(r.h);
    if (r.wing !== "fixed" && r.wing !== "inactive") {
      hojas.push({ label: `${label}: Arriba`, length: w, angle: "45°" }, { label: `${label}: Abajo`, length: w, angle: "45°" }, { label: `${label}: Izquierda`, length: h, angle: "45°" }, { label: `${label}: Derecha`, length: h, angle: "45°" });
    }
    junquillos.push({ label: `${label}: Arriba`, length: w, angle: "90°" }, { label: `${label}: Abajo`, length: w, angle: "90°" }, { label: `${label}: Izquierda`, length: h, angle: "90°" }, { label: `${label}: Derecha`, length: h, angle: "90°" });
  });
  return { marco, travesanos, hojas, junquillos };
}

    const sys = catalog[state.brand][Math.min(state.systemIndex, catalog[state.brand].length - 1)];
    const glass = glassCatalog[state.glassIndex];
    const color = colorsByBrand[state.brand][Math.min(state.colorIndex, colorsByBrand[state.brand].length - 1)];
    const c = calcQuote({ width: state.width, height: state.height, qty: state.qty, tree: state.tree, sys, glass, color, rail: state.rail, installation: state.installation, transport: state.transport, margin: state.margin, discount: state.discount });
    calcOk = Number.isFinite(c.total) && c.total >= 0 && Number.isFinite(c.area) && c.leaves.length === ids.length;
  } catch (e) { calcOk = false; }
  checks.push({ name: "Motor de cálculo consistente", pass: calcOk });
  checks.push({ name: "Catálogo de perfiles cargado", pass: profileFamilies.length > 200 });
  return { ok: checks.every((c) => c.pass), checks, ranAt: new Date().toString() };
}

function handleLeafClick(id, clientX, clientY, rect) {
  const tool = state.activeTool;
  if (tool.mode === "select") { state.selectedId = id; return; }
  if (tool.mode === "split") {
    const fraction = tool.axis === "col" ? (clientX - rect.left) / rect.width : (clientY - rect.top) / rect.height;
    const result = splitLeafFn(state.tree, id, tool.axis, fraction);
    const node = findNode(result, id);
    state.tree = result;
    if (node && node.kind === "split") state.selectedId = node.children[0].id;
    state.activeTool = { mode: "select" };
    return;
  }
  state.tree = setWingFn(state.tree, id, tool.wing);
  state.selectedId = id;
  state.activeTool = { mode: "select" };
}

const root = document.getElementById("app");

function motionGlyph(wing, spec) {
  if (wing === "sliding" || wing === "lift-slide" || wing === "folding-sliding") return spec.direction === "Izquierda" ? "←" : "→";
  if (wing === "fixed" || wing === "inactive") return "FIJO";
  return (wingDefs.find((w) => w.id === wing) || {}).icon || "?";
}

function renderFrameNode(node, widthMm, heightMm, selectedId, flexBasis) {
  if (node.kind === "split") {
    const axisClass = node.axis === "row" ? "axisRow" : "axisCol";
    const children = node.children.map((child, i) => renderFrameNode(
      child,
      node.axis === "col" ? widthMm * node.ratios[i] : widthMm,
      node.axis === "row" ? heightMm * node.ratios[i] : heightMm,
      selectedId,
      node.ratios[i] + " 1 0%"
    )).join("");
    return `<div class="splitNode ${axisClass}" style="flex:${flexBasis}">${children}</div>`;
  }
  const hasSash = node.wing !== "fixed" && node.wing !== "inactive";
  const showOpeningLines = hasSash && node.wing !== "sliding" && node.wing !== "lift-slide" && node.wing !== "folding-sliding";
  const glyph = esc(motionGlyph(node.wing, node.spec));
  const hojaHit = hasSash
    ? `<button type="button" class="hit hitHoja" title="Hoja / tipo de apertura" data-action="part-click" data-part="hoja" data-id="${node.id}"><span class="motion">${glyph}</span>${showOpeningLines ? '<i class="openingLines"></i>' : ""}</button>`
    : `<span class="motion">${glyph}</span>`;
  const herrajeHit = hasSash
    ? `<button type="button" class="hit hitHerraje" title="Herraje / manilla" data-action="part-click" data-part="herraje" data-id="${node.id}">⚙</button>`
    : "";
  return `<div class="pane ${node.id === selectedId ? "selectedPane" : ""}" style="flex:${flexBasis}" data-leaf="${node.id}">
    <button type="button" class="hit hitMarco" title="Marco / estado" data-action="part-click" data-part="marco" data-id="${node.id}" aria-label="Marco de ${esc(wingName(node.wing))}"></button>
    ${hojaHit}
    <button type="button" class="hit hitVidrio" title="Vidrio" data-action="part-click" data-part="vidrio" data-id="${node.id}"></button>
    ${herrajeHit}
    <em>${esc(wingName(node.wing))}</em>
    <small class="paneHardware">${esc(node.spec.hardware.replace("Roto · ", ""))}</small>
    <b class="paneDim">${Math.round(widthMm)} × ${Math.round(heightMm)}</b>
  </div>`;
}

function renderCorteCategory(title, pieces, qty) {
  if (!pieces.length) return "";
  const allPieces = [];
  for (let i = 0; i < qty; i++) allPieces.push(...pieces);
  const bars = packBars(allPieces, BAR_LENGTH_MM, KERF_MM);
  const totalWaste = bars.reduce((a, b) => a + b.waste, 0);
  const totalUsed = bars.reduce((a, b) => a + b.used, 0);
  const wastePct = totalUsed + totalWaste > 0 ? (totalWaste / (totalUsed + totalWaste)) * 100 : 0;
  const barsHtml = bars.map((bar, bi) => `
    <div class="cutBarRow">
      <div class="cutBarLabel"><span>Barra ${bi + 1} · ${BAR_LENGTH_MM} mm</span><span>Resto: ${Math.round(bar.waste)} mm</span></div>
      <div class="cutBar">
        ${bar.pieces.map((p, pi) => `<div class="cutBarPiece" style="flex:${p.length} 0 0%;background:${pi % 2 === 0 ? "var(--accent)" : "#14231c"}" title="${esc(p.label)} · ${p.length} mm · ${p.angle}">${p.length}</div>`).join("")}
        ${bar.waste > 0 ? `<div class="cutBarWaste" style="flex:${bar.waste} 0 0%">${Math.round(bar.waste)}</div>` : ""}
      </div>
    </div>`).join("");
  return `<div class="cutGroup">
    <div class="cutGroupHead"><b>${esc(title)}</b><span>${bars.length} barra(s) de ${BAR_LENGTH_MM} mm · ${wastePct.toFixed(1)}% desperdicio</span></div>
    ${barsHtml}
  </div>`;
}

function renderApp() {
  const sys = catalog[state.brand][Math.min(state.systemIndex, catalog[state.brand].length - 1)];
  const glass = glassCatalog[state.glassIndex];
  const color = colorsByBrand[state.brand][Math.min(state.colorIndex, colorsByBrand[state.brand].length - 1)];
  const calc = calcQuote({ width: state.width, height: state.height, qty: state.qty, tree: state.tree, sys, glass, color, rail: state.rail, installation: state.installation, transport: state.transport, margin: state.margin, discount: state.discount });
  const selectedNode = findNode(state.tree, state.selectedId);
  const selectedLeaf = selectedNode && selectedNode.kind === "leaf" ? selectedNode : null;
  const selectedDims = calc.leaves.find((l) => l.id === state.selectedId) || null;
  const summary = configSummary(calc);
  const hasRailOptions = sys.rails.some((x) => x > 0);
  const warnings = []
    .concat(state.width > sys.maxW || state.height > sys.maxH ? [`Medida supera el límite de referencia ${sys.maxW} × ${sys.maxH} mm.`] : [])
    .concat(glass.thickness > sys.glazing ? [`Vidrio de ${glass.thickness} mm supera el galce de referencia (${sys.glazing} mm).`] : [])
    .concat(state.rail > 0 && !sys.rails.includes(state.rail) ? [`El sistema no contempla ${state.rail} riel(es).`] : []);

  const sc = state.selfCheck || { ok: true, checks: [] };
  const scTitle = sc.checks.map((c) => `${c.pass ? "✓" : "✗"} ${c.name}`).join("\n");
  const topbar = `<header class="topbar">
    <a class="brand" href="#top"><span class="brandMark">L</span><span>LUFT <b>PVC</b></span></a>
    <div class="projectName"><span>PROYECTO ACTIVO</span><strong>Oferta ${esc(state.code)} · ${esc(state.designation)} ${esc(state.location)}</strong></div>
    <div class="headerActions">
      <span class="selfCheckBadge ${sc.ok ? "ok" : "warn"}" title="${esc(scTitle)}">${sc.ok ? "✓ Sistema OK" : "⚠ Revisar"}</span>
      <button class="primary" data-action="print">Generar informe</button>
    </div>
  </header>`;

  const nav = `<nav class="moduleNav">${TABS.map((x) => `<button class="${state.tab === x ? "active" : ""}" data-action="set-tab" data-value="${x}">${x}</button>`).join("")}</nav>`;

  let configBody = "";
  if (state.tab === "Resumen") {
    configBody = `
      ${block("01", "Proyecto y cliente", "Datos que aparecerán en la oferta.")}
      <div class="inputGrid two">
        <label>Código<input id="f-code" type="text" value="${esc(state.code)}" data-bind="code"></label>
        <label>Designación<input id="f-designation" type="text" value="${esc(state.designation)}" data-bind="designation"></label>
      </div>
      <label>Ubicación / descripción<input id="f-location" type="text" value="${esc(state.location)}" data-bind="location"></label>
      ${block("02", "Datos para la cotización", "Aparecen en la Cotización del cliente imprimible.")}
      <label>Cliente<input id="f-client" type="text" placeholder="Sr./Sra./Arq. ..." value="${esc(state.client)}" data-bind="client"></label>
      <label>Dirección del proyecto<input id="f-clientAddress" type="text" value="${esc(state.clientAddress)}" data-bind="clientAddress"></label>
      <label>Fecha de entrega<input id="f-deliveryDate" type="date" value="${esc(state.deliveryDate)}" data-bind="deliveryDate"></label>
      <div class="summaryCard"><span>Marca</span><b>${esc(state.brand)}</b><span>Sistema</span><b>${esc(sys.name)}</b><span>Configuración</span><b>${esc(summary)}</b><span>Superficie total</span><b>${(calc.area * state.qty).toFixed(3)} m²</b></div>`;
  } else if (state.tab === "Diseño") {
    configBody = `
      ${block("01", "Marca y sistema", "Catálogo técnico del proyecto.")}
      <div class="segmented">
        <button class="${state.brand === "Aluplast" ? "selected" : ""}" style="${state.brand === "Aluplast" ? `background:${BRAND_ACCENT.Aluplast}` : ""}" data-action="change-brand" data-value="Aluplast">ALUPLAST</button>
        <button class="${state.brand === "Deceuninck" ? "selected" : ""}" style="${state.brand === "Deceuninck" ? `background:${BRAND_ACCENT.Deceuninck}` : ""}" data-action="change-brand" data-value="Deceuninck">DECEUNINCK</button>
      </div>
      <label>Sistema<select data-action="change-system">${catalog[state.brand].map((x, i) => `<option value="${i}" ${i === state.systemIndex ? "selected" : ""}>${esc(x.name)}${x.sourced ? " ✓" : ""}</option>`).join("")}</select></label>
      ${sys.sourced ? `<p class="sourceNote"><b>✓ Datos reales</b> — precio de marco/hoja tomado de la lista EXWORK Veracruz (rev. ABR_22), convertido a MXN @ ${EUR_MXN}.</p>` : `<p class="sourceNote">Precio de marco/hoja estimado (sin lista de precios de origen para este sistema).</p>`}
      ${hasRailOptions ? `<label>Tipo de riel<select data-bind="rail" data-numeric="true">${sys.rails.map((x) => `<option value="${x}" ${x === state.rail ? "selected" : ""}>${x === 1 ? "Monorriel" : x + " rieles"}</option>`).join("")}</select></label>` : ""}
      ${block("02", "Composición", "Haz clic en el marco, la hoja, el vidrio o el herraje del dibujo para seleccionar esa parte, o usa la paleta para dividir y asignar tipos de apertura.")}
      ${block("03", "Geometría", "Cotas generales en milímetros.")}
      <div class="inputGrid">
        <label>Ancho<input id="f-width" type="number" min="1" value="${state.width}" data-bind="width" data-numeric="true"></label>
        <label>Alto<input id="f-height" type="number" min="1" value="${state.height}" data-bind="height" data-numeric="true"></label>
        <label>Cant.<input id="f-qty" type="number" min="1" value="${state.qty}" data-bind="qty" data-numeric="true"></label>
      </div>
      ${block("04", "Materiales", "Color, aplicación y vidrio.")}
      <label>Color / folio<select data-bind="colorIndex" data-numeric="true">${colorsByBrand[state.brand].map((x, i) => `<option value="${i}" ${i === state.colorIndex ? "selected" : ""}>${esc(x.code)} · ${esc(x.name)}</option>`).join("")}</select></label>
      <div class="inputGrid two">
        <label>Aplicación<select data-bind="face">${["Exterior", "Interior", "Ambas caras"].map((x) => `<option ${x === state.face ? "selected" : ""}>${x}</option>`).join("")}</select></label>
        <label>Vidrio<select data-bind="glassIndex" data-numeric="true">${glassCatalog.map((x, i) => `<option value="${i}" ${i === state.glassIndex ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
      </div>`;
  } else if (state.tab === "Consumo") {
    configBody = `
      ${block("01", "Optimización de corte", "Patrones preliminares sobre barras comerciales de 6 m.")}
      <div class="optimization"><strong>${calc.bars}</strong><span>barras estimadas</span><b>${calc.waste.toFixed(2)} m</b><span>remanente teórico</span></div>
      <label>Longitud de barra<select><option>6,000 mm</option><option>6,500 mm</option></select></label>
      <div class="cutPlan">${calc.leaves.slice(0, 6).map((l, i) => {
        const pieces = [Math.round(l.wMm), Math.round(l.hMm)];
        const used = Math.min(5800, pieces[0] + pieces[1]);
        return `<div><header><b>Hoja ${String.fromCharCode(65 + i)}</b><span>${used} / 6000 mm</span></header><section>${pieces.map((p) => `<i style="width:${Math.max(12, p / 60)}%">${p}</i>`).join("")}<em style="flex:1">${Math.max(0, 6000 - used)}</em></section></div>`;
      }).join("")}</div>
      <p class="notice">La optimización definitiva depende de descuentos, ángulos, soldadura, refuerzos, sierra y reglas específicas del catálogo.</p>
      ${renderProfileCatalog()}`;
  } else if (state.tab === "Servicios") {
    configBody = `
      ${block("01", "Costos adicionales", "Recargos y condiciones comerciales.")}
      <label>Instalación por pieza<input id="f-installation" type="number" value="${state.installation}" data-bind="installation" data-numeric="true"></label>
      <label>Transporte por pieza<input id="f-transport" type="number" value="${state.transport}" data-bind="transport" data-numeric="true"></label>
      <label>Margen de utilidad <b>${state.margin}%</b><input id="f-margin" type="range" min="10" max="60" value="${state.margin}" data-bind="margin" data-numeric="true"></label>
      <label>Descuento <b>${state.discount}%</b><input id="f-discount" type="range" min="0" max="20" value="${state.discount}" data-bind="discount" data-numeric="true"></label>`;
  } else if (state.tab === "Informes") {
    configBody = `
      ${block("01", "Centro de informes", "Selecciona el documento y genera PDF.")}
      <div class="reportList">${REPORTS.map((r) => `<button class="${state.report === r ? "selected" : ""}" data-action="set-report" data-value="${r}">${r}<span>Ver →</span></button>`).join("")}</div>
      <button class="fullButton" data-action="print">Exportar ${state.report} a PDF <span>↗</span></button>`;
  }

  const configPanel = `<aside class="configPanel">
    <div class="eyebrow">MOTOR DE CONFIGURACIÓN · MX</div>
    <h1>${state.tab}</h1>
    <p class="lead">Sistema técnico de diseño, consumo y cotización para cancelería de PVC.</p>
    ${configBody}
  </aside>`;

  const canvasInner = state.view === "Sección"
    ? `<div class="sectionRender"><div class="profileSection"><span class="chamber"></span><span class="chamber"></span><span class="chamber"></span><i class="glassSection" style="width:${Math.max(8, glass.thickness / 2)}px"></i></div><div class="sectionInfo"><b>Sección de sistema</b><span>Profundidad: ${sys.depth} mm</span><span>Acristalamiento: ${glass.thickness} mm</span><span>${state.rail ? `${state.rail} riel${state.rail > 1 ? "es" : ""}` : "Doble contacto"}</span></div></div>`
    : `<div class="modelStage">
        <div class="window ${color.name === "Blanco" ? "whiteFrame" : ""}">${renderFrameNode(state.tree, state.width, state.height, state.selectedId, "1 1 100%")}</div>
        ${state.view === "3D" ? '<span class="modelSide"></span><span class="modelSill"></span>' : ""}
      </div>`;

  const visualPanel = `<section class="visualPanel">
    <div class="visualHeader"><div><span class="statusDot"></span>VISTA ${state.view.toUpperCase()} · ${esc(summary)}</div>
      <div class="viewSwitch">${["Frente", "Sección", "3D"].map((v) => `<button class="${state.view === v ? "active" : ""}" data-action="set-view" data-value="${v}">${v}</button>`).join("")}</div>
    </div>
    <div class="canvas view-${state.view.replace("ó", "o")}">
      <div class="dim top"><span>W=${state.width.toLocaleString()} mm</span></div>
      <div class="dim side"><span>H=${state.height.toLocaleString()} mm</span></div>
      ${state.tab === "Diseño" ? renderToolbox() : ""}
      ${canvasInner}
      <div class="editHint">${esc(toolHint())}</div>
      <div class="specChip"><b>${esc(state.brand)} · ${esc(sys.name)}</b><span>${sys.depth} mm · ${esc(sys.chambers)} · ${state.rail ? `${state.rail} riel${state.rail > 1 ? "es" : ""}` : "practicable"}</span><span>${esc(glass.name)} · ${esc(state.face)}</span></div>
    </div>
    <div class="metricRow">
      <div><span>SUPERFICIE</span><strong>${calc.area.toFixed(3)} m²</strong></div>
      <div><span>VIDRIO ÚTIL</span><strong>${calc.glassArea.toFixed(3)} m²</strong></div>
      <div><span>HOJAS</span><strong>${calc.leaves.length}</strong></div>
      <div><span>REFERENCIA</span><strong>${esc(state.code)}-${esc(state.designation)}</strong></div>
    </div>
  </section>`;

  let quoteBody;
  if (state.tab === "Informes") {
    quoteBody = renderReportPreview(calc, sys, glass);
  } else {
    quoteBody = `
      <div class="propertyGroup"><h2>Información general</h2>
        ${prop("Nombre completo", `${esc(state.designation)} · ${esc(state.location)}`)}
        ${prop("Referencia", `${esc(state.code)}.${esc(state.brand.slice(0, 3).toUpperCase())}`)}
        ${prop("Configuración", esc(summary))}
        ${prop("Hojas", String(calc.leaves.length))}
        ${prop("Riel inferior", state.rail ? String(state.rail) : "N/A")}
      </div>
      <div class="propertyGroup"><h2>Geometría</h2>
        ${prop("Forma", "Rectángulo")}
        ${prop("W", `${state.width.toLocaleString()} mm`)}
        ${prop("H", `${state.height.toLocaleString()} mm`)}
        ${prop("Perímetro", `${calc.perimeter.toFixed(3)} m`)}
        ${prop("Superficie", `${calc.area.toFixed(3)} m²`)}
      </div>
      <div class="propertyGroup"><h2>Prestaciones del sistema</h2>
        ${prop("Profundidad", `${sys.depth} mm`)}
        ${prop("Acristalamiento máx.", `${sys.glazing} mm`)}
        ${prop("Valor Uf", esc(sys.uf))}
        ${prop("Límite de referencia", `${sys.maxW} × ${sys.maxH} mm`)}
      </div>
      <div class="costSummary"><h2>Costos del elemento</h2>
        ${cost("Perfiles", calc.profileCost)}
        ${cost("Accesorios y herrajes", calc.accessories + calc.reinforce + calc.seals)}
        ${calc.addons > 0 ? cost("Persianas Mallorquina", calc.addons) : ""}
        ${cost("Vidrio", calc.glassCost)}
        ${cost("Servicios y consumibles", state.installation + state.transport + calc.consumables)}
        <div class="direct"><span>Costo directo / pza.</span><b>${money(calc.direct)}</b></div>
      </div>
      <div class="totalBox"><span>TOTAL OFERTA <small>IVA no incluido</small></span><strong>${money(calc.total)}</strong><div><span>Utilidad estimada</span><b>${money(calc.utility)}</b></div></div>
      <details class="materials" open><summary>Consumo calculado</summary>
        ${item("PVC-MARCO", "Marco / riel", `${calc.frameM.toFixed(2)} m`)}
        ${item("PVC-HOJA", "Perfil de hoja", `${calc.sashM.toFixed(2)} m`)}
        ${item("VIDRIO", glass.name, `${calc.glassArea.toFixed(3)} m²`)}
        ${item("REF-AC", "Refuerzo galvanizado", `${(calc.frameM + calc.sashM).toFixed(2)} m`)}
        ${item("EPDM", "Juntas y sellos", `${(calc.frameM + calc.sashM).toFixed(2)} m`)}
        ${item("HERRAJE", "Juego de herrajes", `${calc.leaves.length} set`)}
      </details>
      <p class="priceNote">Motor técnico v4 · Editor compositivo estilo RA Workshop + catálogo real Aluplast (EXWORK Veracruz, rev. ABR_22 2022). Valores en MXN. Los precios y límites deben validarse con la lista vigente y la ingeniería de cada proyecto.</p>`;
  }

  const quotePanel = `<aside class="quotePanel">
    <div class="quoteHead"><div><span>PROPIEDADES</span><strong>${esc(state.designation)}</strong></div><span class="badge ${warnings.length ? "warning" : ""}">${warnings.length ? `${warnings.length} alerta${warnings.length > 1 ? "s" : ""}` : "Compatible"}</span></div>
    ${warnings.length ? `<div class="warnings">${warnings.map((x) => `<p>⚠ ${esc(x)}</p>`).join("")}</div>` : ""}
    ${state.tab === "Diseño" && selectedLeaf ? renderPropertiesPanel(selectedLeaf, selectedDims) : ""}
    ${quoteBody}
  </aside>`;

  const footer = `<footer class="sources"><b>Base técnica:</b> documentación RA Workshop aportada, catálogo real Aluplast (lista EXWORK Veracruz, rev. ABR_22 2022), <a href="https://www.aluplast.net/eng-int/products/windows/ideal/" target="_blank" rel="noopener">sistemas oficiales Aluplast</a> y <a href="https://www.deceuninck.com.mx/en/pdf/catalogo_tecnico.pdf" target="_blank" rel="noopener">catálogo técnico Deceuninck México</a>.</footer>`;

  return `<main>${topbar}${nav}<section class="workspace" id="top">${configPanel}${visualPanel}${quotePanel}</section>${footer}</main>`;
}

function block(n, title, sub) { return `<div class="step"><span>${n}</span><div><b>${esc(title)}</b><small>${esc(sub)}</small></div></div>`; }
function prop(k, v) { return `<div class="prop"><span>${esc(k)}</span><b>${v}</b></div>`; }
function cost(label, value) { return `<div class="line"><span>${esc(label)}</span><b>${money(value)}</b></div>`; }
function item(code, name, qty) { return `<div class="materialItem"><span>${esc(code)}</span><div><b>${esc(name)}</b><small>${esc(qty)}</small></div></div>`; }

function render() {
  const active = document.activeElement;
  let restore = null;
  if (active && root.contains(active)) {
    const selector = active.id ? `#${active.id}` : active.dataset.bind ? `[data-bind="${active.dataset.bind}"]` : active.dataset.bindSpec ? `[data-bind-spec="${active.dataset.bindSpec}"]` : null;
    if (selector) restore = { selector, start: "selectionStart" in active ? active.selectionStart : null, end: "selectionEnd" in active ? active.selectionEnd : null };
  }
  root.innerHTML = renderApp();
  if (restore) {
    const el = root.querySelector(restore.selector);
    if (el) {
      el.focus();
      if (restore.start != null && "setSelectionRange" in el) { try { el.setSelectionRange(restore.start, restore.end); } catch (e) {} }
    }
  }
  if (state.focusPart) {
    const target = root.querySelector(".partFocus");
    if (target) target.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

// ---------- EVENTS ----------
root.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "print") { window.print(); return; }
  if (action === "set-tab") { state.tab = el.dataset.value; if (state.tab !== "Diseño") state.activeTool = { mode: "select" }; render(); return; }
  if (action === "set-view") { state.view = el.dataset.value; render(); return; }
  if (action === "set-report") { state.report = el.dataset.value; render(); return; }
  if (action === "change-brand") { changeBrand(el.dataset.value); render(); return; }
  if (action === "tool-select") { state.activeTool = { mode: "select" }; render(); return; }
  if (action === "tool-split") { state.activeTool = { mode: "split", axis: el.dataset.axis }; render(); return; }
  if (action === "tool-wing") { state.activeTool = { mode: "assign-wing", wing: el.dataset.wing }; render(); return; }
  if (action === "merge") { handleMerge(); render(); return; }
  if (action === "reset-tree") { handleResetTree(); render(); return; }
  if (action === "part-click") {
    const id = el.dataset.id;
    const part = el.dataset.part;
    if (state.activeTool.mode === "select") {
      state.selectedId = id;
      state.focusPart = part;
    } else {
      const paneEl = el.closest("[data-leaf]");
      const rect = paneEl.getBoundingClientRect();
      handleLeafClick(id, e.clientX, e.clientY, rect);
      state.focusPart = null;
    }
    render();
    return;
  }
});

function handleFieldChange(e) {
  const t = e.target;
  if (t.dataset.action === "change-system") { changeSystem(Number(t.value)); render(); return; }
  if (t.dataset.bind) {
    let v = t.dataset.numeric === "true" ? Number(t.value) : t.value;
    if (["width", "height", "qty"].includes(t.dataset.bind)) v = Math.max(1, v);
    state[t.dataset.bind] = v;
    render();
    return;
  }
  if (t.dataset.bindSpec) {
    const node = findNode(state.tree, state.selectedId);
    if (node && node.kind === "leaf") { state.tree = updateSpecFn(state.tree, node.id, { [t.dataset.bindSpec]: t.value }); render(); }
    return;
  }
  if (t.dataset.bindSpecBool) {
    const node = findNode(state.tree, state.selectedId);
    if (node && node.kind === "leaf") { state.tree = updateSpecFn(state.tree, node.id, { [t.dataset.bindSpecBool]: t.checked }); render(); }
  }
}
root.addEventListener("input", handleFieldChange);
root.addEventListener("change", handleFieldChange);

state.selfCheck = runSelfCheck();
render();
setInterval(() => { state.selfCheck = runSelfCheck(); render(); }, 25000);
</script>
